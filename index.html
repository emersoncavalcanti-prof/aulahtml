<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somador de números</title>
  <style>
    :root {
      --ink: #eef4f0;
      --muted: #a9b8b0;
      --paper: #17211d;
      --panel: #22312a;
      --accent: #df5b3f;
      --accent-dark: #ff866c;
      --line: #405249;
      --success: #8bd6a7;
      --input: #18251f;
      --shadow: 0 22px 55px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --ink: #1d2a24;
      --muted: #66756d;
      --paper: #f5f1e8;
      --panel: #fffdf8;
      --accent-dark: #a83c2b;
      --line: #d9d4c7;
      --success: #26724b;
      --input: #fff;
      --shadow: 0 22px 55px rgba(47, 44, 33, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(223, 91, 63, 0.16), transparent 24%),
        radial-gradient(circle at 90% 85%, rgba(63, 126, 95, 0.15), transparent 27%),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(28px, 6vw, 54px);
      background: var(--panel);
      border: 1px solid rgba(217, 212, 199, 0.9);
      box-shadow: var(--shadow);
      animation: appear 500ms ease-out both;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .theme-toggle {
      width: auto;
      padding: 9px 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      font-size: 0.72rem;
    }

    .theme-toggle:hover {
      color: var(--panel);
      background: var(--ink);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent-dark);
      font: 700 0.75rem/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 4.6rem);
      line-height: 0.94;
      letter-spacing: 0;
    }

    .intro {
      margin: 22px 0 24px;
      color: var(--muted);
      font: 1rem/1.6 Arial, sans-serif;
    }

    .calculator {
      display: grid;
      gap: 14px;
    }

    .display {
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
      padding: 16px;
      overflow: hidden;
      background: var(--input);
      border: 1px solid var(--line);
      text-align: right;
    }

    .expression {
      min-height: 18px;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font: 0.82rem Arial, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display-value {
      max-width: 100%;
      overflow: hidden;
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .key {
      min-height: 54px;
      padding: 12px 8px;
      color: var(--ink);
      background: var(--input);
      border: 0;
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
      font: 700 1.05rem Arial, sans-serif;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .key:hover, .key:focus-visible { background: var(--line); transform: translateY(-1px); }
    .key:focus-visible, .theme-toggle:focus-visible { outline: 3px solid rgba(223, 91, 63, 0.35); outline-offset: 2px; }

    .key-operation {
      color: var(--accent-dark);
      background: rgba(223, 91, 63, 0.1);
    }

    .key-equals {
      color: #fff;
      background: var(--accent);
    }

    .key-equals:hover, .key-equals:focus-visible { background: var(--accent-dark); }

    .message {
      min-height: 28px;
      margin: 8px 0 0;
      font: 1.15rem/1.45 Georgia, "Times New Roman", serif;
    }

    .message.success { color: var(--success); }
    .message.error { color: var(--accent-dark); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 430px) {
      main { padding: 24px 18px; }
      .key { min-height: 50px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema claro">Tema claro</button>
    </div>
    <p class="eyebrow">Operação simples</p>
    <h1>Some dois números.</h1>
    <p class="intro">Faça cálculos com o teclado ou usando os botões abaixo.</p>

    <section class="calculator" aria-label="Calculadora">
      <div class="display" aria-live="polite">
        <span class="expression" id="expression"></span>
        <output class="display-value" id="display-value">0</output>
      </div>

      <div class="keypad">
        <button class="key key-operation" type="button" data-action="clear">AC</button>
        <button class="key key-operation" type="button" data-action="backspace" aria-label="Apagar último dígito">DEL</button>
        <button class="key key-operation" type="button" data-action="percent">%</button>
        <button class="key key-operation" type="button" data-operation="/" aria-label="Dividir">÷</button>
        <button class="key" type="button" data-number="7">7</button>
        <button class="key" type="button" data-number="8">8</button>
        <button class="key" type="button" data-number="9">9</button>
        <button class="key key-operation" type="button" data-operation="*" aria-label="Multiplicar">×</button>
        <button class="key" type="button" data-number="4">4</button>
        <button class="key" type="button" data-number="5">5</button>
        <button class="key" type="button" data-number="6">6</button>
        <button class="key key-operation" type="button" data-operation="-" aria-label="Subtrair">−</button>
        <button class="key" type="button" data-number="1">1</button>
        <button class="key" type="button" data-number="2">2</button>
        <button class="key" type="button" data-number="3">3</button>
        <button class="key key-operation" type="button" data-operation="+" aria-label="Somar">+</button>
        <button class="key" type="button" data-number="0">0</button>
        <button class="key key-operation" type="button" data-action="sign" aria-label="Trocar sinal">±</button>
        <button class="key" type="button" data-action="decimal">,</button>
        <button class="key key-equals" type="button" data-action="equals" aria-label="Calcular resultado">=</button>
      </div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const displayValue = document.querySelector('#display-value');
    const expression = document.querySelector('#expression');
    const message = document.querySelector('#message');
    const themeToggle = document.querySelector('#theme-toggle');
    const keypad = document.querySelector('.keypad');
    let currentValue = '0';
    let storedValue = null;
    let pendingOperation = null;
    let shouldResetDisplay = false;

    const savedTheme = localStorage.getItem('sum-theme') || 'dark';
    document.body.dataset.theme = savedTheme;

    function updateThemeToggle() {
      const isDark = document.body.dataset.theme === 'dark';
      themeToggle.textContent = isDark ? 'Tema claro' : 'Tema escuro';
      themeToggle.setAttribute('aria-label', isDark ? 'Ativar tema claro' : 'Ativar tema escuro');
    }

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = nextTheme;
      localStorage.setItem('sum-theme', nextTheme);
      updateThemeToggle();
    });

    updateThemeToggle();

    function updateDisplay() {
      displayValue.textContent = currentValue.replace('.', ',');
      expression.textContent = storedValue === null || pendingOperation === null
        ? ''
        : `${storedValue.replace('.', ',')} ${pendingOperation === '*' ? '×' : pendingOperation === '/' ? '÷' : pendingOperation}`;
    }

    function clearCalculator() {
      currentValue = '0';
      storedValue = null;
      pendingOperation = null;
      shouldResetDisplay = false;
      message.textContent = '';
      updateDisplay();
    }

    function inputNumber(number) {
      if (shouldResetDisplay) {
        currentValue = number;
        shouldResetDisplay = false;
      } else {
        currentValue = currentValue === '0' ? number : currentValue + number;
      }
      message.textContent = '';
      updateDisplay();
    }

    function inputDecimal() {
      if (shouldResetDisplay) {
        currentValue = '0.';
        shouldResetDisplay = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      updateDisplay();
    }

    function calculate() {
      const firstValue = Number(storedValue);
      const secondValue = Number(currentValue);
      let result;

      if (pendingOperation === '+') result = firstValue + secondValue;
      if (pendingOperation === '-') result = firstValue - secondValue;
      if (pendingOperation === '*') result = firstValue * secondValue;
      if (pendingOperation === '/') {
        if (secondValue === 0) {
          message.textContent = 'Não é possível dividir por zero.';
          message.className = 'message error';
          return;
        }
        result = firstValue / secondValue;
      }

      currentValue = Number(result.toPrecision(12)).toString();
      storedValue = null;
      pendingOperation = null;
      shouldResetDisplay = true;
      message.textContent = '';
      updateDisplay();
    }

    function chooseOperation(operation) {
      if (pendingOperation !== null && !shouldResetDisplay) calculate();
      storedValue = currentValue;
      pendingOperation = operation;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === 'clear') clearCalculator();
      if (action === 'backspace') {
        currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
        updateDisplay();
      }
      if (action === 'decimal') inputDecimal();
      if (action === 'sign' && currentValue !== '0') {
        currentValue = currentValue.startsWith('-') ? currentValue.slice(1) : `-${currentValue}`;
        updateDisplay();
      }
      if (action === 'percent') {
        currentValue = (Number(currentValue) / 100).toString();
        updateDisplay();
      }
      if (action === 'equals' && pendingOperation !== null) calculate();
    }

    keypad.addEventListener('click', (event) => {
      const key = event.target.closest('button');
      if (!key) return;
      if (key.dataset.number) inputNumber(key.dataset.number);
      if (key.dataset.operation) chooseOperation(key.dataset.operation);
      if (key.dataset.action) handleAction(key.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) inputNumber(event.key);
      if (event.key === '.' || event.key === ',') inputDecimal();
      if (['+', '-', '*', '/'].includes(event.key)) chooseOperation(event.key);
      if (event.key === 'Enter' || event.key === '=') handleAction('equals');
      if (event.key === 'Backspace') handleAction('backspace');
      if (event.key === 'Escape') handleAction('clear');
      if (event.key === '%') handleAction('percent');
    });

    updateDisplay();
  </script>
</body>
</html>
